name: 'Build RustNet'
description: 'Build RustNet binary for a specific target'

inputs:
  target:
    description: 'Rust target triple (e.g., x86_64-unknown-linux-gnu)'
    required: true
  cargo-command:
    description: 'Cargo command to use (cargo or cross)'
    required: false
    default: 'cargo'
  default-features:
    description: 'Enable default features including eBPF (true/false)'
    required: false
    default: 'true'
  strip-symbols:
    description: 'Strip debug symbols from binary (true/false)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Build binary
      shell: bash
      env:
        RUSTFLAGS: ${{ inputs.strip-symbols == 'true' && '-C strip=symbols' || '' }}
      run: |
        mkdir -p assets  # Ensure asset dir exists for build.rs

        BUILD_CMD="${{ inputs.cargo-command }} build --verbose --release --target ${{ inputs.target }}"

        if [[ "${{ inputs.default-features }}" != "true" ]]; then
          BUILD_CMD="$BUILD_CMD --no-default-features"
        fi

        echo "Running: $BUILD_CMD"
        $BUILD_CMD

    - name: Verify Windows Npcap delay loading
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vswhere -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        if (-not $installPath) {
          throw "Visual Studio C++ tools were not found"
        }

        $dumpbinPattern = Join-Path $installPath "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe"
        $dumpbin = Get-ChildItem $dumpbinPattern |
          Sort-Object FullName -Descending |
          Select-Object -First 1
        if (-not $dumpbin) {
          throw "dumpbin.exe was not found"
        }

        $executable = (Resolve-Path "target\${{ inputs.target }}\release\rustnet.exe").Path
        $imports = (& $dumpbin.FullName /imports $executable | Out-String)
        if ($LASTEXITCODE -ne 0) {
          throw "dumpbin failed while inspecting rustnet.exe"
        }
        foreach ($dll in @("Packet.dll", "wpcap.dll")) {
          if ($imports -notmatch "(?is)following delay load imports:.*?$([regex]::Escape($dll))") {
            throw "$dll is not listed as a delay-loaded import"
          }
        }

        & $executable --version
        if ($LASTEXITCODE -ne 0) {
          throw "rustnet --version failed with exit code $LASTEXITCODE"
        }
        & $executable --help | Out-Null
        if ($LASTEXITCODE -ne 0) {
          throw "rustnet --help failed with exit code $LASTEXITCODE"
        }
