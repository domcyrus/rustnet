name: Build Platforms

# Reusable workflow for building RustNet on all platforms.
# Called by both test-platform-builds.yml and release.yml

on:
  workflow_call:
    inputs:
      create-archives:
        description: 'Create release archives with README/LICENSE (true for release, false for test)'
        type: boolean
        default: false
      strip-symbols:
        description: 'Strip debug symbols from binaries'
        type: boolean
        default: false
      version:
        description: 'Version string for archive naming (e.g., v0.3.0)'
        type: string
        default: ''

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: read
    name: build-${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - linux-x64-gnu
          - linux-aarch64-gnu
          - linux-armv7-gnueabihf
          - macos-aarch64
          - macos-x64
          - windows-x64-msvc
          - windows-x86-msvc
        include:
          - os: ubuntu-22.04
          - cargo: cargo
          - build: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            run-tests: true
          - build: linux-aarch64-gnu
            target: aarch64-unknown-linux-gnu
            cargo: cross
          - build: linux-armv7-gnueabihf
            target: armv7-unknown-linux-gnueabihf
            cargo: cross
          - build: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            run-tests: true
          - build: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
          - build: windows-x64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - build: windows-x86-msvc
            os: windows-latest
            target: i686-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        uses: ./.github/actions/setup-linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # unpinned: maintained branch by Rust team member
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Install cross
        if: matrix.cargo == 'cross'
        run: cargo install cross@0.2.5

      - name: Build
        uses: ./.github/actions/build-rustnet
        with:
          target: ${{ matrix.target }}
          cargo-command: ${{ matrix.cargo }}
          default-features: ${{ contains(matrix.target, 'linux') && 'true' || 'false' }}
          strip-symbols: ${{ inputs.strip-symbols && 'true' || 'false' }}

      - name: Run tests
        if: matrix.run-tests
        run: cargo test --verbose

      # For test builds: upload raw binary
      - name: Upload binary artifact
        if: ${{ !inputs.create-archives }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustnet-${{ matrix.build }}
          path: target/${{ matrix.target }}/release/rustnet${{ contains(matrix.os, 'windows') && '.exe' || '' }}
          if-no-files-found: error

      # For release builds: create archive with README/LICENSE
      - name: Create release archive
        if: ${{ inputs.create-archives }}
        id: archive
        uses: ./.github/actions/package-archive
        with:
          binary: target/${{ matrix.target }}/release/rustnet${{ contains(matrix.os, 'windows') && '.exe' || '' }}
          target: ${{ matrix.target }}
          version: ${{ inputs.version }}
          format: ${{ contains(matrix.os, 'windows') && 'zip' || 'tar' }}

      - name: Upload release archive
        if: ${{ inputs.create-archives }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-${{ matrix.target }}
          path: ${{ steps.archive.outputs.asset }}
          if-no-files-found: error

  # x86_64 and the native Android build link against Alpine's static libpcap.
  # armv7 and x86 (i686) are cross-compiled with zig cc as the C compiler and
  # linker (no external toolchain download needed): the `Install cross toolchain`
  # step runs for matrix entries that set `zig-target` and builds a static
  # libpcap for them under /cross-sysroot.
  build-static:
    permissions:
      contents: read
    name: build-linux-static-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # -C strip=symbols: strip debug symbols for a smaller binary.
          # -C link-arg=-l:libzstd.a: fix elfutils 0.189+ zstd dependency
          # (libbpf/bpftool#152); Alpine's libpcap-dev links against zstd too.
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            bin: target/release/rustnet
            rustflags: '-C strip=symbols -C link-arg=-l:libzstd.a'
          - arch: x86_64-android
            target: x86_64-linux-android-musl
            features: '--no-default-features'
            bin: target/release/rustnet
            rustflags: '-C strip=symbols -C link-arg=-l:libzstd.a'
          # -C link-self-contained=no: let zig provide the musl CRT (avoids a
          # duplicate _start when both Rust's self-contained crt1.o and zig's
          # crt1.o are linked). zig bundles musl libc for all targets, so no
          # -l:libzstd.a is needed. `cross-host` is the config.sub-style triple
          # used for the compiler wrapper name and libpcap's --host.
          - arch: armv7-android
            target: armv7-linux-android-musl
            features: '--no-default-features'
            rust-target: armv7-unknown-linux-musleabihf
            zig-target: arm-linux-musleabihf
            cross-host: arm-linux-musleabihf
            bin: target/armv7-unknown-linux-musleabihf/release/rustnet
            rustflags: '-C strip=symbols -C link-self-contained=no'
          - arch: x86-android
            target: i686-linux-android-musl
            features: '--no-default-features'
            rust-target: i686-unknown-linux-musl
            zig-target: x86-linux-musl
            cross-host: i686-linux-musl
            bin: target/i686-unknown-linux-musl/release/rustnet
            rustflags: '-C strip=symbols -C link-self-contained=no'
    container:
      image: rust:alpine
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          apk add --no-cache \
            musl-dev libpcap-dev pkgconfig build-base perl \
            elfutils-dev zlib-dev zlib-static zstd-dev zstd-static \
            clang llvm linux-headers curl git bash
          rustup component add rustfmt

      - name: Install cross toolchain
        if: matrix.zig-target
        run: |
          rustup target add ${{ matrix.rust-target }}
          apk add zig flex bison bash

          # zig cc wrapper: cc-rs detects it as clang and passes --target=<rust triple>
          # (armv7-*, i686-*) which zig rejects (zig spells them arm and x86), so
          # filter those args out and pass the zig target instead. cc-rs also emits
          # -Wl,-melf_i386 for i686, which zig's linker does not accept.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/bin/bash' \
            'args=()' \
            'for arg in "$@"; do' \
            '  case "$arg" in --target=*|-Wl,-melf_i386) ;; *) args+=("$arg") ;; esac' \
            'done' \
            'exec zig cc -target ${{ matrix.zig-target }} "${args[@]}"' \
            > /usr/local/bin/${{ matrix.cross-host }}-gcc
          chmod +x /usr/local/bin/${{ matrix.cross-host }}-gcc

          # libpcap is pinned by version + sha256 (Dependabot does not track
          # tarballs fetched in run steps, so bump the URL and the hash together).
          curl -fsSL --retry 3 --retry-delay 5 \
            -o libpcap.tar.gz https://www.tcpdump.org/release/libpcap-1.10.5.tar.gz
          echo "37ced90a19a302a7f32e458224a00c365c117905c2cd35ac544b6880a81488f0  libpcap.tar.gz" | sha256sum -c -
          tar xzf libpcap.tar.gz
          cd libpcap-1.10.5
          CC=${{ matrix.cross-host }}-gcc \
            ./configure --host=${{ matrix.cross-host }} \
              --disable-shared --enable-static \
              --disable-usb --disable-dbus --disable-bluetooth --disable-remote \
              --prefix=/cross-sysroot
          make -j"$(nproc)" && make install
          cd ..

          # Point cargo at the wrapper and pkg-config at the cross libpcap.
          linker_var="CARGO_TARGET_$(echo '${{ matrix.rust-target }}' | tr 'a-z-' 'A-Z_')_LINKER"
          {
            echo "$linker_var=${{ matrix.cross-host }}-gcc"
            echo "PKG_CONFIG_PATH=/cross-sysroot/lib/pkgconfig"
            echo "PKG_CONFIG_SYSROOT_DIR=/cross-sysroot"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"

      - name: Build static binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release ${{ matrix.features }} ${{ matrix.rust-target && format('--target {0}', matrix.rust-target) || '' }}

      - name: Verify static linking
        run: |
          file "${{ matrix.bin }}"
          # Use file command to verify (ldd behaves differently inside Alpine)
          file "${{ matrix.bin }}" | grep -q "static.* linked" || \
            (echo "ERROR: Binary is not statically linked" && exit 1)

      # For test builds: upload raw binary
      - name: Upload binary artifact
        if: ${{ !inputs.create-archives }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustnet-linux-static-${{ matrix.arch }}
          path: ${{ matrix.bin }}
          if-no-files-found: error

      # For release builds: create archive
      - name: Create release archive
        if: ${{ inputs.create-archives }}
        id: archive
        uses: ./.github/actions/package-archive
        with:
          binary: ${{ matrix.bin }}
          target: ${{ matrix.target }}
          version: ${{ inputs.version }}

      - name: Upload release archive
        if: ${{ inputs.create-archives }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-${{ matrix.target }}
          path: ${{ steps.archive.outputs.asset }}
          if-no-files-found: error

  # aarch64 static builds run on a native ARM runner WITHOUT a job-level container:
  # JS actions (checkout, upload-artifact) cannot run in an Alpine container on ARM
  # runners. The musl build itself happens inside `docker run rust:alpine`, so the
  # workspace and all actions stay on the host where they work.
  build-static-arm:
    permissions:
      contents: read
    name: build-linux-static-${{ matrix.arch }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            features: '--features default'
          - arch: aarch64-android
            target: aarch64-linux-android-musl # Note: it's not a real rust target but we rename the artifact
            features: '--no-default-features'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build static binary
        run: |
          docker run --rm \
            -v "$PWD:/build" -w /build \
            -e CARGO_TERM_COLOR -e RUST_BACKTRACE \
            -e CFLAGS="-mno-outline-atomics" \
            -e CXXFLAGS="-mno-outline-atomics" \
            -e RUSTFLAGS="-C strip=symbols -C link-arg=-l:libzstd.a" \
            rust:alpine sh -euc '
              apk add --no-cache \
                musl-dev libpcap-dev pkgconfig build-base perl \
                elfutils-dev zlib-dev zlib-static zstd-dev zstd-static \
                clang llvm linux-headers
              rustup component add rustfmt
              cargo build --release ${{ matrix.features }}
            '
          sudo chown -R "$(id -u):$(id -g)" target

      - name: Verify static linking
        run: |
          file target/release/rustnet
          file target/release/rustnet | grep -q "static.* linked" || \
            (echo "ERROR: Binary is not statically linked" && exit 1)

      # For test builds: upload raw binary
      - name: Upload binary artifact
        if: ${{ !inputs.create-archives }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustnet-linux-static-${{ matrix.arch }}
          path: target/release/rustnet
          if-no-files-found: error

      # For release builds: create archive
      - name: Create release archive
        if: ${{ inputs.create-archives }}
        id: archive
        uses: ./.github/actions/package-archive
        with:
          binary: target/release/rustnet
          target: ${{ matrix.target }}
          version: ${{ inputs.version }}

      - name: Upload release archive
        if: ${{ inputs.create-archives }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-${{ matrix.target }}
          path: ${{ steps.archive.outputs.asset }}
          if-no-files-found: error

