name: Validate WinGet schema 1.28
on:
  push:
    branches: [test/winget-1.7.0-validation]
    paths: [.github/workflows/validate-winget-schema.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Install WinGet 1.29.380
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'winget-setup'
          New-Item -ItemType Directory -Path $setup -Force | Out-Null
          $release = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380'
          Invoke-WebRequest "$release/DesktopAppInstaller_Dependencies.zip" -OutFile "$setup/dependencies.zip"
          Invoke-WebRequest "$release/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" -OutFile "$setup/winget.msixbundle"
          Expand-Archive "$setup/dependencies.zip" -DestinationPath "$setup/dependencies"
          $dependencies = @(Get-ChildItem "$setup/dependencies/x64/*.appx" | Select-Object -ExpandProperty FullName)
          Add-AppxPackage -Path "$setup/winget.msixbundle" -DependencyPath $dependencies -ForceApplicationShutdown
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'WinGet setup failed' }
      - name: Validate proposed manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:RUNNER_TEMP 'winget-manifests'
          New-Item -ItemType Directory -Path $manifest -Force | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $manifest 'domcyrus.RustNet.installer.yaml'), [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $manifest 'domcyrus.RustNet.locale.en-US.yaml'), [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $manifest 'domcyrus.RustNet.yaml'), [Convert]::FromBase64String(''))
          Get-ChildItem $manifest | Get-FileHash -Algorithm SHA256 | Format-List
          winget validate --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed' }
          'WinGet 1.29.380: schema 1.28.0 validation passed for RustNet 1.7.0.' | Out-File $env:GITHUB_STEP_SUMMARY
