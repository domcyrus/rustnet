name: Test Platform Builds

# Test builds on all supported platforms.
# Uses the shared build-platforms workflow.
# Also triggers a FreeBSD test build in the rustnet-bsd repo.

on:
  workflow_dispatch:
    inputs:
      create-archives:
        description: 'Also run the release archive step so the package-archive action is exercised'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'Cross.toml'
      - 'src/**'
      - 'crates/**'
      - '.github/workflows/test-platform-builds.yml'
      - '.github/workflows/build-platforms.yml'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-platforms.yml
    with:
      create-archives: ${{ inputs.create-archives || false }}
      strip-symbols: false
      version: test-${{ github.run_id }}

  build-freebsd:
    name: build-freebsd-x64
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1.5.3
        with:
          release: '14.2'
          usesh: true
          prepare: pkg install -y curl libpcap rust
          run: cargo build --locked --verbose --release --no-default-features

  trigger-freebsd-build:
    name: trigger-freebsd-build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger FreeBSD test build
        run: |
          REF="${{ github.sha }}"
          TAG="test-$(date +%Y%m%d-%H%M%S)"

          gh api repos/domcyrus/rustnet-bsd/dispatches \
            -f event_type=freebsd-build \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[rustnet_ref]=$REF" \
            -f "client_payload[create_release]=false"
        env:
          GH_TOKEN: ${{ secrets.BSD_DISPATCH_TOKEN }}
